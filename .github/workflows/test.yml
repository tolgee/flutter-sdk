name: Test

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      - name: Test release notes script
        run: node --test .github/scripts/release-notes.test.mjs
