name: Test

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Test tolgee
        working-directory: packages/tolgee
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Test tolgee_in_context
        working-directory: packages/tolgee_in_context
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Test release notes script
        run: node --test .github/scripts/release-notes.test.mjs
