name: tolgee_in_context
description: In-context editing for the Tolgee Flutter SDK in dev builds, using the Tolgee web editor.
version: 2.0.0
homepage: https://tolgee.io/
repository: https://github.com/tolgee/flutter-sdk/tree/main/tolgee_in_context

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  tolgee: ^2.0.0
  webview_flutter: ^4.14.1
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  http: ^1.0.1

flutter:
  assets:
    - assets/tolgee_dialog.html
    - assets/tolgee_bridge.js
